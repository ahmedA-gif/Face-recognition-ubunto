camera:
  source: rtsp://admin:admin1234@192.168.2.112:554/cam/realmonitor?channel=1&subtype=1
  buffer_size: 1
  width: 1280
  height: 720
  ip: 192.168.2.112
  username: admin
  channel: 1

models:
  yolo_weights: D:\Face-recognition-ubunto\models\yolo\yolo11n.pt
  yolo_onnx: D:\Face-recognition-ubunto\models\yolo\yolo11n.onnx
  yolo_imgsz: 416
  yolo_conf: 0.45
  yolo_iou: 0.5
  person_class_id: 0
  face_root: D:\Face-recognition-ubunto\models\face
  face_pack: buffalo_s
  face_det_size:
    - 320
    - 320
  face_match_threshold: 0.35
  min_face_px: 1
  tracker: bytetrack
  tracker_config: D:\Face-recognition-ubunto\models\tracker\bytetrack.yaml

pipeline:
  device: cuda:0
  backend: onnx
  skip_frames: 2
  face_every_n: 3
  max_tracks: 50

gpu:
  enabled: true
  vram_threshold_gb: 2.0
  tensorrt_fp16: true
  tensorrt_int8: false

# =============================================================================
# CROSSING LINE (ObjectCounter-style) - PREFERRED ENTRY/EXIT ENGINE
# Simple line crossing detection: tracks crossing the line are counted as IN/OUT
# =============================================================================
crossing_line:
  enabled: true
  line:
    x1: 0.1
    y1: 0.83
    x2: 0.9
    y2: 0.83
  entry_direction: downward  # camera looks out; people enter by moving DOWN (y increases)
  min_track_frames: 3
  cooldown_sec: 2.0
  min_crossing_gap_sec: 1.0

# =============================================================================
# DOOR INTELLIGENCE (POLYGON ZONES) - DISABLED (use crossing_line instead)
# =============================================================================
door_intelligence:
  enabled: false
  camera_id: office_entrance
  zones_path: config/zones.yaml
  probe: foot

# =============================================================================
# ENTRY/EXIT LINE ENGINE - PRIMARY (EntryExitEngineV2)
# =============================================================================
entry_exit:
  line:
    x1: 0.25
    y1: 0.0
    x2: 0.75
    y2: 1.0
  entry_direction: B_to_A  # B_to_A means: B side to A side = ENTRY
  buffer_threshold: 10.0    # Pixels for BUFFER zone
  debounce_sec: 1.5         # Lockout period after event
  min_track_frames: 5      # Minimum track frames before processing
  min_deep_frames: 3        # Frames deep in state before event
  min_displacement: 20.0    # Minimum distance traveled
  use_foot_point: true      # Use foot point (bottom-center) for accuracy
  segment_pad: 0.12         # Segment padding for line detection
  camera_id: office_entrance

redis:
  enabled: true
  url: redis://localhost:6379/0
  stream: attendance:events
  maxlen: 10000
  fallback_path: data/db/events_redis_fallback.jsonl

identity_fusion:
  enabled: true
  max_stitch_dist_px: 60
  max_stitch_time_sec: 2.0
  embedding_match_threshold: 0.42
  appearance_match_threshold: 0.85
  person_reid_weights: ''
  reid_match_threshold: 0.82
  reid_every_n: 1
  max_pool_embeddings: 8
  state_path: data/db/identity_state.json

auto_boundary:
  enabled: false
  min_tracks_for_learning: 40
  adaptation_rate: 0.05
  smoothing: true

reasoning:
  enabled: false
  window_bias: false
  morning_window:
    - 07:00
    - '11:00'
  evening_window:
    - '16:00'
    - '20:00'
  uturn_sec: 10.0
  tailgate_sec: 2.0

attendance:
  enabled: true
  db_path: D:\Face-recognition-ubunto\data\db\attendance.db
  shift_start: 09:00
  shift_end: '17:00'
  late_threshold_mins: 15
  early_exit_mins: 15
  debounce_minutes: 2.0

events:
  db_path: D:\Face-recognition-ubunto\data\db\events.db
  faces_db_path: D:\Face-recognition-ubunto\data\db\faces.db
  snapshots_dir: D:\Face-recognition-ubunto\data\snapshots
  save_snapshots: true

overlay:
  show_person_box: true
  show_face_box: true
  show_labels: true
  show_boundary: true
  pulse_frames: 10
  hud: true

gallery:
  images_dir: D:\Face-recognition-ubunto\data\faces_gallery

_root: D:\Face-recognition-ubunto
