# Person Face Events — CPU settings

camera:
  # ── via go2rtc (recommended — start ./go2rtc first) ──────────────────────
  source: "rtsp://127.0.0.1:8554/cam_01_sub"  # sub stream — best for CPU AI
  # source: "rtsp://127.0.0.1:8554/cam_01"    # main stream — higher quality
  #
  # ── Direct (no go2rtc) ────────────────────────────────────────────────────
  # source: "rtsp://admin:admin1234@192.168.2.112:554/cam/realmonitor?channel=1&subtype=0"
  # source: 0   # USB webcam
  buffer_size: 1
  width: 1280
  height: 720
  ip: "192.168.2.112"
  username: "admin"
  # password: "${CAMERA_PASSWORD}"  # set via environment variable
  channel: 1

models:
  yolo_weights: "models/yolo/yolo11n.pt"
  yolo_onnx: "models/yolo/yolo11n.onnx"
  yolo_imgsz: 416
  yolo_conf: 0.45
  yolo_iou: 0.5
  person_class_id: 0          # COCO person only

  face_root: "models/face"
  face_pack: "buffalo_l"      # ArcFace R50 — high-accuracy (already downloaded)
  face_det_size: [640, 640]
  face_match_threshold: 0.42  # cosine similarity (tune up for stricter matching)
  min_face_px: 1

  tracker: "bytetrack"
  tracker_config: "models/tracker/bytetrack.yaml"

pipeline:
  device: "cpu"
  skip_frames: 2              # run heavy detect every N frames
  face_every_n: 3
  max_tracks: 50

# Virtual door line (normalized 0–1 of frame width/height)
entry_exit:
  line:
    x1: 0.25
    y1: 0.82
    x2: 0.75
    y2: 0.82
  entry_direction: "B_to_A"   # B→A = entry (from outside through gate into room)
  debounce_sec: 1.5
  min_track_frames: 8
  hysteresis_px: 12           # jitter-suppression band around the line (px)

# ── Identity Fusion & Re-ID ───────────────────────────────────────────────────
# Resolves "same person, different track IDs" into persistent global ids.
identity_fusion:
  enabled: true
  max_stitch_dist_px: 60          # spatial window to stitch expired tracks (px)
  max_stitch_time_sec: 2.0        # temporal window to stitch expired tracks (s)
  embedding_match_threshold: 0.42 # ArcFace cosine threshold for pool Re-ID
  max_pool_embeddings: 8          # embeddings kept per identity (lighting views)

# ── Auto-Adjusting Virtual Boundary ───────────────────────────────────────────
# OPT-IN. Learns a new line from trajectory flow and replaces the manual
# entry_exit line when confident. In testing it was unreliable (noise can
# drag the line off the door and invert entry/exit semantics), so it is OFF
# by default: the configured entry_exit line below is used as-is, which is
# deterministic. Turn ON only if your camera geometry demands it.
auto_boundary:
  enabled: false
  min_tracks_for_learning: 40     # trajectories needed before boundary activates
  adaptation_rate: 0.05           # EMA smoothing step once learned
  smoothing: true

# ── Spatial-Temporal Knowledge Reasoning ──────────────────────────────────────
reasoning:
  enabled: true
  window_bias: false              # OPT-IN: time-of-day direction override while
                                  # the boundary is uncalibrated. Keep OFF so
                                  # entries always produce check-ins.
  morning_window: ["07:00", "11:00"]   # used only if window_bias: true
  evening_window: ["16:00", "20:00"]   # used only if window_bias: true
  uturn_sec: 3.0                       # U-turn / loitering void window
  tailgate_sec: 2.0                    # anti-tailgating alert window

# ── Automated Attendance ──────────────────────────────────────────────────────
attendance:
  enabled: true
  db_path: "data/db/attendance.db"
  shift_start: "09:00"
  shift_end: "17:00"
  late_threshold_mins: 15
  early_exit_mins: 15
  debounce_minutes: 2.0           # per-person multi-track dedup window

events:
  db_path: "data/db/events.db"
  faces_db_path: "data/db/faces.db"
  snapshots_dir: "data/snapshots"
  save_snapshots: true

overlay:
  show_person_box: true
  show_face_box: true
  show_labels: true
  show_boundary: true             # draw the learned dynamic boundary line
  pulse_frames: 10
  hud: true

gallery:
  images_dir: "data/faces_gallery"
